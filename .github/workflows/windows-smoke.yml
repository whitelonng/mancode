name: Windows compatibility gate

on:
  push:
  pull_request:

jobs:
  windows-shells:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lock publication and crash recovery
        run: npm run check:windows
      - name: Bounded execution and structured TDD evidence
        run: npx vitest run tests/execution-protocol.test.ts tests/execution-runner.test.ts tests/execution-worker.test.ts tests/tdd-evidence.test.ts tests/vitest-evidence-reporter.test.ts
      - name: CMD
        shell: cmd
        run: npm run test:windows-smoke
      - name: PowerShell
        shell: powershell
        run: npm run test:windows-smoke
      - name: Git Bash
        shell: bash
        run: npm run test:windows-smoke
      - name: Upgrade through CMD
        shell: cmd
        env:
          MANCODE_CLI_BINARY: ${{ github.workspace }}/dist/cli.js
          MANCODE_UPGRADE_REAL_TEST_ROOT: ${{ runner.temp }}
          MANCODE_UPGRADE_TEST_SHELL: cmd
        run: npx vitest run tests/upgrade-e2e.test.ts
      - name: Upgrade through PowerShell
        shell: powershell
        env:
          MANCODE_CLI_BINARY: ${{ github.workspace }}/dist/cli.js
          MANCODE_UPGRADE_REAL_TEST_ROOT: ${{ runner.temp }}
          MANCODE_UPGRADE_TEST_SHELL: powershell
        run: npx vitest run tests/upgrade-e2e.test.ts
      - name: Upgrade through Git Bash
        shell: bash
        env:
          MANCODE_CLI_BINARY: ${{ github.workspace }}/dist/cli.js
          MANCODE_UPGRADE_REAL_TEST_ROOT: ${{ runner.temp }}
          MANCODE_UPGRADE_TEST_SHELL: bash
        run: |
          export MANCODE_UPGRADE_TEST_BASH="$(cygpath -w "$(command -v bash)")"
          npx vitest run tests/upgrade-e2e.test.ts
      - name: Real npm install cancellation and timeout
        env:
          MANCODE_UPGRADE_REAL_TEST_ROOT: ${{ runner.temp }}
        run: npx vitest run tests/upgrade-package.test.ts
