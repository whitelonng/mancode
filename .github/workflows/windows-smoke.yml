name: Windows compatibility gate

on:
  push:
  pull_request:

jobs:
  windows-shells:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Lock publication and crash recovery
        run: npx vitest run tests/local-lock.test.ts tests/local-lock-crash.test.ts tests/entity-home-store-contracts.test.ts
      - name: CMD
        shell: cmd
        run: npm run test:windows-smoke
      - name: PowerShell
        shell: powershell
        run: npm run test:windows-smoke
      - name: Git Bash
        shell: bash
        run: npm run test:windows-smoke
