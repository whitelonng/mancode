(()=>{'use strict';let data=JSON.parse(document.getElementById('mancode-progress-data').textContent);const live=false;let sequence=-1;let instanceId=null;let polling=false;const byId=id=>document.getElementById(id);const text=(id,value)=>{byId(id).textContent=value};const el=(tag,cls,value)=>{const node=document.createElement(tag);if(cls)node.className=cls;if(value!==undefined)node.textContent=value;return node};const stateNames={current:'当前有效',partial:'部分有效',historical:'历史记录',reference:'参考记录',conflict:'存在冲突'};const issueNames={business_blocker:'外部阻塞',test_failed:'测试失败',review_findings:'审查问题',evidence_stale:'验收证据需核对',runtime_repair:'运行时状态需修复'};function empty(target,message){target.append(el('div','empty',message))}function source(parent,value){parent.append(el('p','source','来源：'+value))}function taskCard(task){const card=el('article','card');const head=el('div','card-head');head.append(el('h3','',task.title),el('span','badge'+(['已完成','已验收'].includes(task.state)?' good':task.issue==='business_blocker'?' warn':''),task.issue==='business_blocker'&&task.state==='已暂停'?'阻塞':task.state));card.append(head,el('p','small muted',(task.modules.join(' / ')||'模块未登记')+' · 阶段 '+task.phase));if(task.issue){card.append(el('div','reason',(issueNames[task.issue]||'需核对')+(task.reason?'：'+task.reason:'')))}card.append(el('p','next small','下一步：'+(task.next||'尚未登记')));const details=el('details');details.append(el('summary','','验收与来源'));details.append(el('p','small muted','发布状态：暂无可验证的本地发布记录'));if(task.acceptance.length){const list=el('ul','small');for(const criterion of task.acceptance)list.append(el('li','',criterion.id+' · '+criterion.text+' — '+criterion.state));details.append(list)}else details.append(el('p','small muted','尚未登记验收条件'));source(details,task.source+' @ '+task.revision);if(task.owner)details.append(el('p','source','负责人：'+task.owner));card.append(details);return card}
const boardColumns=[
{id:'todo',name:'未开始',empty:'暂无未开始任务'},
{id:'doing',name:'进行中',empty:'暂无进行中任务'},
{id:'review',name:'待审核',empty:'暂无待审核任务'},
{id:'blocked',name:'阻塞',empty:'暂无阻塞项'}
];
const archiveGroups=[
{id:'paused',name:'已暂停',empty:'暂无暂停任务'},
{id:'check',name:'需核对',empty:'暂无需核对任务'},
{id:'done',name:'已完成',empty:'暂无已完成任务'},
{id:'closed',name:'已放弃 / 已替代',empty:'暂无已放弃或已替代任务'}
];
function taskGroup(task){
if(task.state==='已完成')return 'done';
if(['已放弃','已替代'].includes(task.state))return 'closed';
if(task.state==='需核对')return 'check';
if(task.issue==='business_blocker')return 'blocked';
if(task.state==='仅规划')return 'doing';
if(task.state==='已暂停')return 'paused';
if(task.state==='未开始')return 'todo';
if(task.state==='待审核')return 'review';
return 'doing';
}
function renderTasks(){
const target=byId('tasks'),archives=byId('task-archives');
const expanded=new Set([...archives.querySelectorAll('details.task-archive[open]')].map(node=>node.dataset.group));
target.replaceChildren();archives.replaceChildren();
const query=byId('task-filter').value.trim().toLowerCase();
const tasks=data.tasks.filter(task=>[task.title,task.state,task.issue==='business_blocker'?'阻塞':'',task.id,task.reason||'',task.next||'',...task.modules].join(' ').toLowerCase().includes(query));
const grouped=new Map([...boardColumns,...archiveGroups].map(group=>[group.id,[]]));
for(const task of tasks)grouped.get(taskGroup(task)).push(task);
text('task-filter-count','已加载 '+data.tasks.length+' 项 · 匹配 '+tasks.length+' 项'+(data.omissions.tasks?' · 尚有任务未加载':''));
for(const column of boardColumns){
const items=grouped.get(column.id),section=el('section','column column-'+column.id),head=el('div','column-head'),dot=el('span','state-dot'),body=el('div','column-body');
section.dataset.column=column.id;section.setAttribute('aria-label',column.name);dot.setAttribute('aria-hidden','true');
head.append(dot,el('h3','',column.name),el('span','column-count',String(items.length)));
for(const task of items)body.append(taskCard(task));
if(!items.length)empty(body,query?'没有匹配的'+column.name+'任务':column.empty);
section.append(head,body);target.append(section);
}
for(const group of archiveGroups){
const items=grouped.get(group.id);
if(!items.length&&group.id!=='done')continue;
const section=el('details','task-archive'),body=el('div','cards');section.dataset.group=group.id;
section.open=expanded.has(group.id)||Boolean(query&&items.length)||group.id==='check';
section.append(el('summary','',group.name+' · '+items.length+' 项'));
for(const task of items)body.append(taskCard(task));
if(!items.length)empty(body,query?'没有匹配的'+group.name+'任务':group.empty);
section.append(body);archives.append(section);
}
}
function render(){text('project-name',data.project);text('scope-note',data.scopeNote);text('generated','生成于 '+data.generatedAt);text('completed',data.totals.completed+' / '+data.totals.registered);text('accepted',String(data.totals.accepted));text('blocked',String(data.totals.blocked));text('transport',data.transport);const active=data.tasks.find(task=>!['已完成','已放弃','已替代'].includes(task.state));text('focus-title',active?active.title:'当前没有活动任务');text('focus-next',active?(active.next||'下一步尚未登记'):'已登记进展会显示在这里。');const diagnostics=byId('diagnostics');diagnostics.replaceChildren();const omitted=Object.values(data.omissions).reduce((total,count)=>total+count,0);if(omitted)diagnostics.append(el('div','notice',live?'列表按批展示，可在各视图加载更多。':'离线快照仅保留各列表前 100 条；其余 '+omitted+' 条需通过本地预览按需查看。'));for(const diagnostic of data.diagnostics)diagnostics.append(el('div','notice',diagnostic));renderTasks();const modules=byId('modules');modules.replaceChildren();for(const module of data.modules){const card=el('article','card');card.append(el('h3','',module.name),el('p','module-count',String(module.registered??module.tasks.length)),el('p','muted small','已登记任务'));const details=el('details');details.append(el('summary','','查看任务引用'));for(const id of module.tasks)source(details,id);card.append(details);modules.append(card)}if(!data.modules.length)empty(modules,'尚未登记模块范围');const decisions=byId('decisions');decisions.replaceChildren();for(const item of data.decisions){const card=el('article','card');const head=el('div','card-head');head.append(el('h3','',item.title),el('span','badge',stateNames[item.state]||'需核对'));card.append(head,el('p','',item.statement));if(item.rationale)card.append(el('p','small muted','理由：'+item.rationale));source(card,item.source);decisions.append(card)}if(!data.decisions.length)empty(decisions,'暂无可展示的确认决定');const timeline=byId('timeline');timeline.replaceChildren();for(const event of data.timeline){const row=el('article','event');row.append(el('div','small muted',event.time),el('h3','',event.title));source(row,event.source);timeline.append(row)}if(!data.timeline.length)empty(timeline,'暂无已登记的演进记录');const pitfalls=byId('pitfalls');pitfalls.replaceChildren();for(const item of data.pitfalls){const card=el('article','card');card.append(el('h3','',item.option),el('p','',item.reason));source(card,item.source);pitfalls.append(card)}if(!data.pitfalls.length)empty(pitfalls,'暂无已确认的避坑记录');for(const button of document.querySelectorAll('[data-more]'))button.hidden=!live||!data.omissions[button.dataset.more];}for(const button of document.querySelectorAll('[data-tab]')){button.addEventListener('click',()=>{for(const tab of document.querySelectorAll('[data-tab]'))tab.setAttribute('aria-selected',String(tab===button));for(const panel of document.querySelectorAll('[role=tabpanel]'))panel.hidden=panel.id!=='panel-'+button.dataset.tab});button.addEventListener('keydown',event=>{if(!['ArrowLeft','ArrowRight'].includes(event.key))return;event.preventDefault();const tabs=[...document.querySelectorAll('[data-tab]')];const next=tabs[(tabs.indexOf(button)+(event.key==='ArrowRight'?1:-1)+tabs.length)%tabs.length];next.focus();next.click()})}byId('task-filter').addEventListener('input',renderTasks);for(const button of document.querySelectorAll('[data-more]'))button.addEventListener('click',async()=>{button.disabled=true;try{const kind=button.dataset.more;const response=await fetch('/api/'+kind+'?offset='+data[kind].length+'&version='+encodeURIComponent(data.version),{cache:'no-store'});if(!response.ok)throw new Error('stale');const page=await response.json();if(page.version!==data.version)throw new Error('stale');data[kind].push(...page.items);data.omissions[kind]=page.next===null?0:1;render()}catch{text('connection','数据已变化，请等待同步')}finally{button.disabled=false}});render();async function poll(){if(polling)return;polling=true;try{const response=await fetch('/api/version',{cache:'no-store'});if(!response.ok)throw new Error('offline');const version=await response.json();if(instanceId!==version.instanceId){instanceId=version.instanceId;sequence=-1}if(version.sequence<sequence)throw new Error('out-of-order');sequence=version.sequence;text('connection',version.stale?'同步滞后 · 保留最近状态':version.notifications==='connected'?'本地实时预览':'预览已连接 · 更新通知未确认');byId('connection').className='badge'+(version.stale?' warn':version.notifications==='connected'?' good':'');if(!version.stale&&version.version!==data.version){const fresh=await fetch('/api/data?version='+encodeURIComponent(version.version),{cache:'no-store'});if(!fresh.ok)throw new Error('stale');const next=await fresh.json();if(next.version!==version.version)throw new Error('stale');data=next;render()}}catch{text('connection','连接中断 · 最近已知状态');byId('connection').className='badge warn'}finally{polling=false}}if(live){poll();setInterval(poll,1500)}else text('connection',data.visibility==='shared-snapshot'?'离线共享快照':'离线本地快照');})();
</script></body></html>
